name: Build & Release APK

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Setup Keystore for Signing
        id: setup-keystore
        run: |
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "Menggunakan keystore dari GitHub Secrets..."
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > release-keystore.jks
            echo "KEYSTORE_PATH=$GITHUB_WORKSPACE/release-keystore.jks" >> $GITHUB_ENV
            echo "STORE_PASSWORD=${{ secrets.STORE_PASSWORD }}" >> $GITHUB_ENV
            echo "KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}" >> $GITHUB_ENV
          else
            echo "Membuat self-signed keystore untuk CI..."
            keytool -genkeypair -v -keystore release-keystore.jks \
              -alias upload \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass "overlaynotes" \
              -keypass "overlaynotes" \
              -dname "CN=OverlayNotes, OU=CI, O=OverlayNotes, C=ID"
            echo "KEYSTORE_PATH=$GITHUB_WORKSPACE/release-keystore.jks" >> $GITHUB_ENV
            echo "STORE_PASSWORD=overlaynotes" >> $GITHUB_ENV
            echo "KEY_PASSWORD=overlaynotes" >> $GITHUB_ENV
          fi

      - name: Build Release APK with Gradle
        run: ./gradlew assembleRelease --stacktrace

      - name: Upload Release APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OverlayNotes-Release-APK
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Create GitHub Release (if tag pushed)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/app-release.apk
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
